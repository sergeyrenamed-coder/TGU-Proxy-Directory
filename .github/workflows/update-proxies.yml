name: Update TGU proxy catalog

on:
  workflow_dispatch:
    inputs:
      socks_limit:
        description: "Maximum monosans SOCKS5 candidates to test"
        required: false
        default: "100"
  schedule:
    - cron: "*/15 * * * *"
  push:
    branches: [main]
    paths:
      - ".github/workflows/update-proxies.yml"
      - "scripts/**"
      - "tests/**"
      - "data/sources.json"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: tgu-proxy-catalog
  cancel-in-progress: true

jobs:
  collect-and-deploy:
    name: Collect, validate and publish
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: false

      - name: Run collector tests
        run: python -m unittest discover -s tests -v

      - name: Collect proxy sources
        env:
          SOCKS_LIMIT: ${{ github.event.inputs.socks_limit || '100' }}
        run: python scripts/collect.py --socks-limit "$SOCKS_LIMIT"

      - name: Commit updated catalog
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/*.json docs/data/*.json
          if git diff --cached --quiet; then
            echo "Catalog is unchanged; no commit is needed."
          else
            git commit -m "chore: refresh proxy catalog"
            git push
          fi

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload website
        uses: actions/upload-pages-artifact@v4
        with:
          path: docs/

      - name: Deploy website
        id: deployment
        uses: actions/deploy-pages@v4
