name: Update TGU proxy catalog

on:
  workflow_dispatch:
    inputs:
      socks_limit:
        description: "Maximum monosans SOCKS5 candidates to test"
        required: false
        default: "1000"
  schedule:
    - cron: "*/15 * * * *"
  push:
    branches: [main]
    paths:
      - ".github/workflows/update-proxies.yml"
      - "scripts/**"
      - "tests/**"
      - "data/sources.json"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: tgu-proxy-catalog
  cancel-in-progress: true

jobs:
  collect-and-deploy:
    name: Collect, validate and publish
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install collector dependencies
        run: python -m pip install --disable-pip-version-check -r requirements.txt

      - name: Run collector tests
        run: python -m unittest discover -s tests -v

      - name: Collect proxy sources
        env:
          SOCKS_LIMIT: ${{ github.event.inputs.socks_limit || '1000' }}
        run: python scripts/collect.py --socks-limit "$SOCKS_LIMIT"

      - name: Sync catalog to RNMDStore Netlify API
        continue-on-error: true
        env:
          TGU_NETLIFY_CATALOG_SYNC_URL: ${{ secrets.TGU_NETLIFY_CATALOG_SYNC_URL }}
          TGU_NETLIFY_SYNC_TOKEN: ${{ secrets.TGU_NETLIFY_SYNC_TOKEN }}
        run: |
          if [ -z "$TGU_NETLIFY_CATALOG_SYNC_URL" ] || [ -z "$TGU_NETLIFY_SYNC_TOKEN" ]; then
            echo "::warning::Netlify catalog sync is not configured. GitHub catalog publication will continue normally."
            exit 0
          fi

          curl --silent --show-error --fail-with-body \
            --retry 3 --retry-all-errors --retry-delay 2 \
            --request POST \
            --header "Authorization: Bearer $TGU_NETLIFY_SYNC_TOKEN" \
            --header "Content-Type: application/json" \
            --data-binary @data/proxies.json \
            "$TGU_NETLIFY_CATALOG_SYNC_URL"

      - name: Commit updated catalog
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/*.json docs/data/*.json
          if git diff --cached --quiet; then
            echo "Catalog is unchanged; no commit is needed."
          else
            git commit -m "chore: refresh proxy catalog"
            git push
          fi

      - name: Configure GitHub Pages
        id: pages
        uses: actions/configure-pages@v5
        continue-on-error: true

      - name: Explain Pages setup requirement
        if: steps.pages.outcome != 'success'
        run: echo "::warning::Proxy catalog was refreshed successfully. Enable Settings > Pages > Build and deployment > Source > GitHub Actions to publish the website."

      - name: Upload website
        if: steps.pages.outcome == 'success'
        uses: actions/upload-pages-artifact@v4
        with:
          path: docs/

      - name: Deploy website
        if: steps.pages.outcome == 'success'
        id: deployment
        uses: actions/deploy-pages@v4
