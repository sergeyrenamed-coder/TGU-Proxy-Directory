name: RU Checker offline tests
on:
  pull_request:
    paths:
      - "ru_checker/**"
      - "scripts/**"
      - "tests/**"
      - "docs/**"
      - ".github/workflows/test-ru-checker.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v
      - run: python -m compileall -q scripts ru_checker
      - run: python scripts/package_ru_function.py
