name: RU Checker 400 proxy one-shot

on:
  push:
    branches:
      - test/ru-bulk400-once
    paths:
      - ".github/ru-bulk400-start.txt"

permissions:
  contents: read

concurrency:
  group: tgu-ru-bulk400-20261119
  cancel-in-progress: false

jobs:
  run:
    name: Check 400 unique endpoints via Yandex Cloud
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies for offline checks
        run: python -m pip install --disable-pip-version-check -r requirements.txt
      - name: Verify bulk-test code offline
        run: |
          python -m unittest tests/test_ru_bulk_400.py -v
          python -m compileall -q scripts/ru_bulk_400.py
      - name: Check 400 proxies in 13 bounded cloud calls
        env:
          TGU_RU_FUNCTION_URL: ${{ secrets.TGU_RU_FUNCTION_URL }}
          TGU_RU_FUNCTION_API_KEY: ${{ secrets.TGU_RU_FUNCTION_API_KEY }}
        run: python scripts/ru_bulk_400.py --count 400 --output ru-bulk-400-report.json
      - name: Upload results (including partial results on failure)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tgu-ru-400-proxy-report
          path: ru-bulk-400-report.json
          if-no-files-found: warn
          retention-days: 14
