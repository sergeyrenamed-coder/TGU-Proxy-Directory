name: RNMD Music Directory — experimental checks
on:
  pull_request:
    paths:
      - 'docs/**'
      - 'data/music/**'
      - 'scripts/music_directory.py'
      - 'scripts/music_stream_check.py'
      - 'tests/test_music_stream_check.py'
      - 'tests/test_music_directory.py'
      - '.github/workflows/test-music-directory.yml'
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate JavaScript
        run: node --check docs/assets/app.js
      - name: Validate directory schema and collector
        run: python -m unittest tests.test_music_directory tests.test_music_stream_check -v
      - name: Openverse live discovery smoke test (non-blocking)
        id: smoke
        continue-on-error: true
        run: |
          python scripts/music_directory.py \
            --query "русская музыка" --query "Москва" --query "русский рок" --query "Russian folk" --query "indie pop" \
            --require-results --output music-preview.json
      - name: Check short audio samples from public candidates (non-blocking)
        id: streams
        continue-on-error: true
        run: |
          if test -f music-preview.json; then
            python scripts/music_stream_check.py --input music-preview.json \
              --output music-checked.json --require-results
          fi
      - name: Upload stream-check report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rnmd-music-stream-checks
          path: music-checked.json
          if-no-files-found: warn
      - name: Publish stream-checked metadata to experimental branch
        if: ${{ github.event_name == 'pull_request' && github.head_ref == 'experiment/rnmd-music-directory' && github.event.pull_request.head.repo.full_name == github.repository && steps.streams.outcome == 'success' }}
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          checked = json.loads(Path('music-checked.json').read_text(encoding='utf-8'))
          if not checked.get('track_count'):
              raise SystemExit('No verified streams: refusing to publish an empty catalog')
          index = {
              key: checked[key] for key in (
                  'schema_version', 'directory', 'generated_at',
                  'experimental', 'source_count', 'track_count', 'metadata_candidates',
                  'notes', 'verification', 'tracks'
              )
          }
          # A successful HTTP probe DOES NOT set rights_reviewed or RU verified.
          if not all(t.get('stream_verified') is True and
                     t.get('rights_reviewed') is False and
                     t.get('network_ru_verified') is False
                     for t in index['tracks']):
              raise SystemExit('Unverified track flags do not match pilot policy')
          contents = json.dumps(index, ensure_ascii=False, indent=2) + '\n'
          for path in ['data/music/tracks.json', 'docs/data/music/tracks.json']:
              Path(path).write_text(contents, encoding='utf-8')
          print('Published checked metadata:', index['track_count'])
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/music/tracks.json docs/data/music/tracks.json
          if ! git diff --cached --quiet; then
            git commit -m "data(music): publish reachability-checked open-license metadata preview"
            git push origin HEAD:refs/heads/experiment/rnmd-music-directory
          fi
      - name: Upload unverified preview metadata
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rnmd-music-directory-candidates
          path: music-preview.json
          if-no-files-found: warn
